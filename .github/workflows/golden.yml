name: Native candidate and exact goldens
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      resolution-only:
        default: false
        type: boolean
      musl:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Preserve exact source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ruby/setup-ruby@v1
        if: ${{ !inputs.musl }}
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.resolution-only
        with:
          name: svgpng-0.1.0-eight-gem-candidate-set
          path: release-set
      - name: Install Linux build tools
        if: runner.os == 'Linux' && !inputs.musl
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          location: ${{ runner.temp }}/svgpng-msys2
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
      - name: Install exact Rust toolchain
        if: ${{ !inputs.musl && !inputs.resolution-only }}
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            rustup target add --toolchain 1.85.0 x86_64-pc-windows-gnu
          fi
      - name: Qualify native Unix candidate
        if: runner.os != 'Windows' && !inputs.musl
        shell: bash
        env:
          SVGPNG_TARGET: ${{ inputs.target }}
        run: bash scripts/native/${{ inputs.resolution-only && 'resolve' || 'qualify' }}.sh
      - name: Qualify native UCRT candidate
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          SVGPNG_TARGET: ${{ inputs.target }}
        run: bash scripts/native/${{ inputs.resolution-only && 'resolve' || 'qualify' }}.sh
      - name: Qualify native musl candidate
        if: inputs.musl
        env:
          SVGPNG_TARGET: ${{ inputs.target }}
        run: >-
          docker run --rm -e SVGPNG_TARGET
          -e SVGPNG_OPERATION=${{ inputs.resolution-only && 'resolve' || 'qualify' }} -v "$PWD:/work" -w /work
          alpine:3.21 sh scripts/native/alpine.sh
      - name: Upload immutable qualified candidate
        if: ${{ !inputs.resolution-only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ inputs.target }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 14
