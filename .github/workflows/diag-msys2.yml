name: Diagnose msys2 keyring failure
on:
  push:
    paths: ['.github/workflows/diag-msys2.yml']
permissions:
  contents: read
jobs:
  original-order:
    name: V4 setup-ruby then setup-msys2 as in golden.yml
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: ${{ runner.temp }}/svgpng-msys2
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
  fixed-order:
    name: V5 setup-ruby, setup-msys2 without install, explicit keyring bootstrap
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: ${{ runner.temp }}/svgpng-msys2
          path-type: inherit
      - name: Bootstrap MSYS2 keyring and install UCRT build tools
        shell: msys2 {0}
        run: |
          set -e
          pacman-key --init
          pacman-key --populate msys2
          pacman -S --noconfirm --needed --overwrite '*' \
            mingw-w64-ucrt-x86_64-gcc \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-python
          gcc --version | head -1
          ninja --version
          cmake --version | head -1
          python --version
